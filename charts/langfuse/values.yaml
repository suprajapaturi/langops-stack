langfuse:
  salt:
    secretKeyRef:
      name: langfuse-app-secrets
      key: salt

  nextauth:
    url: "http://localhost:3000"
    secret:
      secretKeyRef:
        name: langfuse-app-secrets
        key: nextauth-secret

  encryptionKey:
    secretKeyRef:
      name: langfuse-app-secrets
      key: encryption-key

postgresql:
  deploy: false
  host: "10.151.0.3"
  port: 5432
  auth:
    username: "langfuse"
    database: "langfuse"
    existingSecret: "langfuse-db-secret"
    secretKeys:
      userPasswordKey: "password"

clickhouse:
  deploy: true
  auth:
    existingSecret: "langfuse-app-secrets"
    existingSecretKey: "clickhouse-password"

redis:
  deploy: true
  auth:
    existingSecret: "langfuse-redis"
    existingSecretPasswordKey: "valkey-password"