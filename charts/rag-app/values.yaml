replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/langops-stack/apps/langops-rag-app
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

env:
  - name: LITELLM_URL
    value: "http://litellm.litellm.svc.cluster.local:4000"
  - name: LANGFUSE_HOST
    value: "http://langfuse-web.langfuse.svc.cluster.local:3000"

envFrom:
  - secretRef:
      name: rag-app-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false

serviceAccount:
  create: true

autoscaling:
  enabled: false